<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Swen Chan portfolio social preview</title>
  <desc id="description">Swen Chan, founder and product and technology builder across AI products, developer tools, and embedded systems.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182723" />
      <stop offset="1" stop-color="#121d1a" />
    </linearGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientTransform="translate(1028 112) rotate(136) scale(470 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f766e" stop-opacity="0.5" />
      <stop offset="1" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientTransform="translate(186 622) rotate(-55) scale(420 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ba6b28" stop-opacity="0.42" />
      <stop offset="1" stop-color="#ba6b28" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#f7f2e8" stroke-opacity="0.035" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)" />
  <rect width="1200" height="630" fill="url(#tealGlow)" />
  <rect width="1200" height="630" fill="url(#warmGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="18" y="18" width="1164" height="594" rx="24" fill="none" stroke="#f7f2e8" stroke-opacity="0.08" />

  <path d="M706 76C897 24 938 212 1112 156" fill="none" stroke="#f7f2e8" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round" />
  <path d="M675 103C854 76 966 259 1169 216" fill="none" stroke="#0f766e" stroke-opacity="0.72" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 15" />
  <ellipse cx="1010" cy="140" rx="136" ry="63" transform="rotate(-12 1010 140)" fill="none" stroke="#f7f2e8" stroke-opacity="0.18" stroke-width="2" />
  <circle cx="1075" cy="111" r="8" fill="#ba6b28" />

  <g font-family="Space Grotesk, Avenir Next, Futura, sans-serif">
    <text x="82" y="84" fill="#f7f2e8" fill-opacity="0.7" font-size="17" font-weight="600" letter-spacing="5">SWEN / PORTFOLIO</text>
    <rect x="82" y="109" width="78" height="4" rx="2" fill="#0f766e" />

    <text x="76" y="276" fill="#f7f2e8" font-size="112" font-weight="700" letter-spacing="-5">Swen Chan</text>
    <text x="82" y="333" fill="#f7f2e8" fill-opacity="0.82" font-size="29" font-weight="500" letter-spacing="0.2">Founder &amp; Product / Technology Builder</text>
    <text x="82" y="388" fill="#f7f2e8" fill-opacity="0.56" font-size="20" font-weight="500" letter-spacing="1.4">BUILDING 0-TO-1 PRODUCTS FROM SIGNAL TO SYSTEM</text>

    <g filter="url(#shadow)" font-size="17" font-weight="600" letter-spacing="1.2">
      <rect x="704" y="402" width="239" height="54" rx="27" fill="#f7f2e8" />
      <text x="734" y="436" fill="#15120f">AI PRODUCTS</text>

      <rect x="832" y="468" width="286" height="54" rx="27" fill="#0f766e" />
      <text x="863" y="502" fill="#f7f2e8">DEVELOPER TOOLS</text>

      <rect x="648" y="527" width="301" height="54" rx="27" fill="#ba6b28" />
      <text x="680" y="561" fill="#f7f2e8">EMBEDDED SYSTEMS</text>
    </g>

    <text x="82" y="566" fill="#f7f2e8" fill-opacity="0.72" font-size="18" font-weight="600" letter-spacing="2.2">REMOTE / INTERNATIONAL</text>
    <text x="1118" y="588" text-anchor="end" fill="#f7f2e8" fill-opacity="0.54" font-size="16" font-weight="500">swen-chan.github.io/PersonalPage</text>
  </g>

  <circle cx="114" cy="494" r="5" fill="#0f766e" />
  <path d="M114 494C264 430 347 531 520 461S735 382 870 406" fill="none" stroke="#f7f2e8" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round" />
</svg>
